          cat > app/src/main/java/id/pakdesurya/pos/StoreDao.java <<'JAVA'
          package id.pakdesurya.pos;
          import androidx.room.Dao;
          import androidx.room.Insert;
          import androidx.room.OnConflictStrategy;
          import androidx.room.Query;
          @Dao public interface StoreDao {
            @Query("SELECT value FROM app_store WHERE key=:key LIMIT 1") String get(String key);
            @Insert(onConflict=OnConflictStrategy.REPLACE) void put(StoreEntry entry);
          }
