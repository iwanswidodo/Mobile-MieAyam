          JAVA
          cat > app/src/main/java/id/pakdesurya/pos/MainActivity.java <<'JAVA'
          package id.pakdesurya.pos;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.webkit.*;
          import android.widget.Toast;
          import android.bluetooth.*;
          import android.content.pm.PackageManager;
          import androidx.room.Room;
          import java.io.*;
          import java.util.UUID;
          
          public class MainActivity extends Activity {
            WebView web;
            AppDatabase database;
            BluetoothAdapter adapter;
            final java.util.concurrent.atomic.AtomicBoolean printing=new java.util.concurrent.atomic.AtomicBoolean(false);
            final String MAC="86:67:7A:CF:48:AE";
            final UUID SPP=UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
            public void onCreate(Bundle b){super.onCreate(b);database=Room.databaseBuilder(getApplicationContext(),AppDatabase.class,"pakdesurya-pos.db").allowMainThreadQueries().build();getWindow().setStatusBarColor(0xFF38251C);getWindow().setNavigationBarColor(0xFF38251C);adapter=BluetoothAdapter.getDefaultAdapter();web=new WebView(this);web.setBackgroundColor(0xFFFFF8ED);web.getSettings().setJavaScriptEnabled(true);web.getSettings().setDomStorageEnabled(true);web.addJavascriptInterface(new Bridge(),"Android");setContentView(web);web.loadUrl("file:///android_asset/index.html");}
            class Bridge {
              @JavascriptInterface public String getData(String key){try{return database.storeDao().get(key);}catch(Exception e){return null;}}
              @JavascriptInterface public void saveData(String key,String value){try{database.storeDao().put(new StoreEntry(key,value));}catch(Exception e){runOnUiThread(()->Toast.makeText(MainActivity.this,"Gagal menyimpan data lokal",Toast.LENGTH_LONG).show());}}
              @JavascriptInterface public void printReceipt(String data){runOnUiThread(()->print(data));}
              @JavascriptInterface public void toast(String s){runOnUiThread(()->Toast.makeText(MainActivity.this,s,Toast.LENGTH_LONG).show());}
              @JavascriptInterface public String appVersion(){return "3.2-preview";}
            }
            void print(String data){
              if(Build.VERSION.SDK_INT>=31&&checkSelfPermission("android.permission.BLUETOOTH_CONNECT")!=PackageManager.PERMISSION_GRANTED){requestPermissions(new String[]{"android.permission.BLUETOOTH_CONNECT"},5);Toast.makeText(this,"Izinkan akses perangkat Bluetooth, lalu tekan Cetak Ulang.",Toast.LENGTH_LONG).show();return;}
              if(adapter==null||!adapter.isEnabled()){Toast.makeText(this,"Aktifkan Bluetooth dan pastikan Rongta sudah pairing.",Toast.LENGTH_LONG).show();return;}
              if(!printing.compareAndSet(false,true)){Toast.makeText(this,"Printer sedang memproses cetakan.",Toast.LENGTH_SHORT).show();return;}
              new Thread(()->{
                String error="Koneksi printer gagal";
                BluetoothSocket current=null;
                try{
                  BluetoothDevice device=adapter.getRemoteDevice(MAC);
                  try{adapter.cancelDiscovery();}catch(Exception ignored){}
                  Exception first=null;
                  try{
                    current=device.createRfcommSocketToServiceRecord(SPP);
                    current.connect();
                  }catch(Exception e){
                    first=e;
                    try{if(current!=null)current.close();}catch(Exception ignored){}
                    current=null;
                    try{
                      current=device.createInsecureRfcommSocketToServiceRecord(SPP);
                      current.connect();
                    }catch(Exception fallback){
                      if(first!=null)fallback.addSuppressed(first);
                      throw fallback;
                    }
                  }
                  OutputStream out=current.getOutputStream();
                  out.write(new byte[]{0x1B,0x40});
                  out.write(data.getBytes("IBM850"));
                  out.write(new byte[]{0x1B,0x64,0x03});
                  out.flush();
                  try{Thread.sleep(350);}catch(InterruptedException ignored){Thread.currentThread().interrupt();}
                  runOnUiThread(()->Toast.makeText(this,"Struk berhasil dikirim ke Rongta.",Toast.LENGTH_LONG).show());
                }catch(Exception e){
                  error=e.getMessage()==null?e.getClass().getSimpleName():e.getMessage();
                  final String message=error;
                  runOnUiThread(()->Toast.makeText(this,"Cetak gagal: "+message+". Cek printer, lalu pilih Cetak Ulang.",Toast.LENGTH_LONG).show());
                }finally{
                  try{if(current!=null)current.close();}catch(Exception ignored){}
                  printing.set(false);
                }
              }).start();
            }
            public void onBackPressed(){if(web!=null)web.evaluateJavascript("backToDashboard()",null);else super.onBackPressed();}
          }
