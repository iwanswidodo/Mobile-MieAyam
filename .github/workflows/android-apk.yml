name: Build POS MieAyam Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/id/pakdesurya/pos app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "POS-MieAyam"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          dependencies {
              implementation 'androidx.room:room-runtime:2.6.1'
              annotationProcessor 'androidx.room:room-compiler:2.6.1'
          }
          android {
              namespace 'id.pakdesurya.pos'
              compileSdk 35
              defaultConfig {
                  applicationId 'id.pakdesurya.pos'
                  minSdk 23
                  targetSdk 32
                  versionCode 32
                  versionName '3.2.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="POS Mie Ayam" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/id/pakdesurya/pos app/src/main/assets
          cat > app/src/main/assets/index.html <<'HTML'
          <!doctype html>
          <html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#38251c"><title>Pak De Surya POS</title>
          <style>
          :root{--ink:#38251c;--brown:#563b2d;--brown2:#74523c;--cream:#fff8ed;--paper:#fffdf8;--gold:#d4a84f;--muted:#9a8b7c;--line:#eee4d6;--green:#55765a;--shadow:0 12px 30px #38251c12}
          *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;padding-bottom:82px}.top{background:linear-gradient(135deg,#38251c,#624532);color:#fff;padding:22px 20px 26px;border-radius:0 0 26px 26px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#f3d99d,#c18d3c);display:grid;place-items:center;color:#503523;font-weight:900;font-size:17px;box-shadow:inset 0 1px #fff8}.brand small{display:block;color:#e6d4bc;letter-spacing:2px;font-size:9px;font-weight:800}.brand b{font-family:Georgia,serif;font-size:18px;letter-spacing:.2px}.toprow{display:flex;justify-content:space-between;align-items:center}.avatar{border:1px solid #ffffff35;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;color:#f5d99f}.greeting{margin-top:24px;color:#e9d9c7;font-size:12px}.greeting h1{font-family:Georgia,serif;color:#fff;font-size:26px;margin:5px 0 0;font-weight:600}.content{padding:18px 16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:5px 0 13px}.section-head h2{font-family:Georgia,serif;font-size:21px;margin:0}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:-2px}.stat{background:var(--paper);padding:16px;border-radius:18px;box-shadow:var(--shadow);border:1px solid #f3eadf}.stat .label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.7px}.stat strong{display:block;font-size:20px;margin-top:8px;letter-spacing:-.5px}.stat em{font-style:normal;color:var(--green);font-size:10px;display:block;margin-top:5px}.panel{background:var(--paper);border:1px solid #f0e7da;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:16px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:#f7efe3;border-radius:15px;padding:14px 6px;color:var(--brown);font-size:11px;font-weight:800}.quick i{display:block;font-style:normal;font-size:22px;margin-bottom:7px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 6px max(9px,env(safe-area-inset-bottom));z-index:5}.nav button{background:none;color:#9a8b7c;font-size:10px;font-weight:700;padding:4px}.nav button.active{color:var(--brown)}.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:var(--paper);border:1px solid #f0e7da;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.food{height:112px;display:grid;place-items:center;font-size:48px;background:radial-gradient(circle at 50% 42%,#f8d77c,#e8b34f 60%,#d18b36)}.food.brown{background:radial-gradient(circle at 50% 42%,#c18a5c,#875234 60%,#593522)}.product-info{padding:12px}.product-info b{font-size:13px;display:block;line-height:1.3}.product-info small{font-size:10px;color:var(--muted)}.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:11px}.price{font-weight:900;font-size:13px}.add{width:30px;height:30px;border-radius:10px;background:var(--brown);color:white;font-size:19px}.field{width:100%;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:12px;outline:none;color:var(--ink);margin:5px 0 10px}.primary{background:var(--brown);color:#fff;padding:14px 18px;border-radius:13px;font-weight:800;width:100%;box-shadow:0 7px 16px #38251c20}.secondary{background:#f2e8d9;color:var(--brown);padding:11px 14px;border-radius:12px;font-weight:800}.cartline,.historyline{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.cartline:last-child{border:0}.qty{display:flex;align-items:center;gap:8px}.qty button{background:#f1e7d8;color:var(--brown);width:25px;height:25px;border-radius:8px;font-weight:900}.total{display:flex;justify-content:space-between;font-weight:900;font-size:17px;padding:14px 0}.pill{display:inline-block;background:#edf3e9;color:#55765a;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:26px;font-size:13px}.modalbg{position:fixed;inset:0;background:#1d130fc0;z-index:9;display:flex;align-items:flex-end}.modal{background:var(--cream);width:100%;border-radius:24px 24px 0 0;padding:22px 18px 28px;max-height:88vh;overflow:auto}.modal h3{font-family:Georgia,serif;font-size:23px;margin:0 0 14px}.close{float:right;background:#eee2d1;border-radius:50%;width:30px;height:30px;color:var(--brown)}.hide{display:none!important}.search{border-radius:14px;background:white;border:1px solid var(--line);padding:12px 14px;width:100%;margin:4px 0 15px}.tag{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:1px}.page-title{font-family:Georgia,serif;font-size:25px;margin:8px 0 3px}.widebtn{display:flex;gap:8px;align-items:center}.danger{background:#f8e7e1;color:#a14e3d}.smallbtn{padding:8px 10px;border-radius:9px;font-size:11px;font-weight:800}

          /* PREMIUM BRAND REFRESH */
          :root{--ink:#291a14;--brown:#3b2419;--brown2:#68452e;--cream:#f7f1e8;--paper:#fffdfa;--gold:#c9a15b;--muted:#938477;--line:#e9dfd2;--green:#55765a;--shadow:0 16px 38px rgba(48,30,18,.075)}
          body{background:linear-gradient(180deg,#f3ece1 0,#faf7f1 340px);font-family:Inter,"Avenir Next",system-ui,sans-serif;letter-spacing:-.12px}
          .app{max-width:620px;margin:0 auto;background:transparent}
          .top{position:relative;overflow:hidden;padding:25px 22px 29px;border-radius:0 0 30px 30px;background:radial-gradient(ellipse at 100% 0%,rgba(207,170,104,.26),transparent 42%),linear-gradient(135deg,#24150f 0%,#40291d 52%,#65472f 100%);box-shadow:0 18px 38px rgba(42,25,15,.2)}
          .top:after{content:"";position:absolute;width:210px;height:210px;border:1px solid rgba(224,190,127,.17);border-radius:50%;right:-88px;bottom:-138px;box-shadow:0 0 0 18px rgba(224,190,127,.035),0 0 0 38px rgba(224,190,127,.025);pointer-events:none}
          .mark{width:49px;height:49px;border-radius:17px;background:linear-gradient(145deg,#f8e4b8,#c69b52);color:#382419;font-family:Georgia,serif;letter-spacing:-1px;box-shadow:0 6px 18px #10090555,inset 0 1px #fff9;font-size:16px}
          .brand small{font-size:8px;letter-spacing:2.2px;color:#d7bd96}.brand b{font-size:20px;letter-spacing:.1px;color:#fff8ec}
          .avatar{background:#ffffff0c;border-color:#d9bb8044;color:#e5c98f}
          .greeting{margin-top:27px;font-size:9px;letter-spacing:2px;font-weight:800;color:#d9c6ac}.greeting h1{font-size:30px;letter-spacing:-.6px;margin-top:8px}
          .content{padding:21px 17px 28px}
          .section-head{margin:7px 0 15px}.section-head h2{font-size:23px;letter-spacing:-.45px;color:#342117}
          .tag{font-size:9px;letter-spacing:2px;color:#b18a4d}
          .muted{color:#958779}
          .stats{gap:12px}.stat{position:relative;overflow:hidden;padding:18px 16px 17px;border-radius:20px;background:linear-gradient(145deg,#fffefa,#fbf7f0);border:1px solid #e9dfd2;box-shadow:0 10px 26px rgba(52,34,20,.055)}
          .stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-30px;top:-32px;background:rgba(201,161,91,.09)}
          .stat .label{font-size:9px;letter-spacing:1.35px;color:#9c8b79}.stat strong{font-family:Georgia,serif;font-size:24px;letter-spacing:-.8px;color:#38251b;margin-top:10px}.stat em{font-size:9px;letter-spacing:.1px;margin-top:7px}
          .panel{padding:18px;border-radius:21px;background:rgba(255,253,249,.94);border:1px solid #e9dfd2;box-shadow:0 12px 30px rgba(52,34,20,.055);margin-top:15px}
          .quick{gap:10px}.quick button{border:1px solid #eee2d1;background:linear-gradient(145deg,#fbf6ed,#f3eadc);border-radius:16px;padding:15px 5px;color:#553a28;font-size:10px;letter-spacing:.2px;transition:transform .15s}.quick i{font-size:23px;color:#9d7844}
          .nav{max-width:620px;margin:0 auto;background:rgba(255,253,249,.96);backdrop-filter:blur(16px);border-top:1px solid #e9dfd2;box-shadow:0 -8px 25px rgba(50,32,20,.05);padding-top:11px}
          .nav button{font-size:9px;letter-spacing:.3px;color:#a99b8d}.nav button.active{color:#65452c}.nav button.active i{color:#b18a4d}.nav i{font-size:20px}
          .product-grid{gap:13px}.product{border-radius:19px;border:1px solid #e9dfd2;box-shadow:0 12px 26px rgba(52,34,20,.07);background:#fffdfa}
          .food{height:125px;font-size:53px;background:radial-gradient(circle at 50% 38%,#ffe5a6 0,#efc36e 47%,#d49b49 100%);position:relative}
          .food:after{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.24);border-radius:13px;pointer-events:none}
          .food.brown{background:radial-gradient(circle at 50% 38%,#d6a77e 0,#a96e48 48%,#68432e 100%)}
          .product-info{padding:13px}.product-info b{font-size:13px;color:#39261b;letter-spacing:-.15px}.product-info small{font-size:9px;letter-spacing:.3px}
          .price{font-family:Georgia,serif;font-size:15px;color:#5a3a24}.add{width:33px;height:33px;border-radius:12px;background:linear-gradient(145deg,#60422d,#352117);box-shadow:0 5px 12px #3b241933;font-size:21px}
          .field,.search{border-radius:13px;border-color:#e7dccd;background:#fffdfa;padding:14px;color:#38251c}.field:focus,.search:focus{border-color:#c5a064;box-shadow:0 0 0 3px #c5a06422}
          .primary{border-radius:14px;background:linear-gradient(110deg,#4c3020,#2c1b13);box-shadow:0 8px 18px rgba(50,30,18,.18);letter-spacing:.75px;font-size:11px;padding:16px}
          .secondary{border-radius:12px;background:#f1e7d8;color:#5a3c27;border:1px solid #e6d7c2}
          .pill{background:#eef2e9;color:#587052;border:1px solid #dce6d6;letter-spacing:.65px}
          .cartline,.historyline{padding:14px 0;border-color:#eee5d9}.total{font-family:Georgia,serif;color:#38251c}
          .modalbg{backdrop-filter:blur(5px);background:rgba(24,15,10,.62)}.modal{background:#faf6ef;border:1px solid #e7dccd;border-radius:27px 27px 0 0;padding:24px 19px 32px;box-shadow:0 -15px 45px #1d130f22}.modal h3{font-size:25px;color:#342117}
          .close{background:#eee4d7;color:#67482f}
          .empty{color:#a09284;padding:30px 18px}
          @media(min-width:500px){.content{padding-left:22px;padding-right:22px}.top{padding-left:26px;padding-right:26px}}
          </style></head><body><div class="app">
          <header class="top"><div class="toprow"><div class="brand"><div class="mark">PDS</div><div><small>MIE AYAM • EST. PAK DE SURYA</small><b>Pak De Surya</b></div></div><div class="avatar">✦</div></div><div class="greeting">SELAMAT DATANG KEMBALI<h1 id="greet">Dashboard</h1></div></header>
          <main class="content" id="view"></main>
          <nav class="nav"><button class="active" data-page="home" onclick="go('home')"><i>⌂</i>Home</button><button data-page="cashier" onclick="go('cashier')"><i>▦</i>Kasir</button><button data-page="products" onclick="go('products')"><i>◈</i>Produk</button><button data-page="history" onclick="go('history')"><i>▤</i>Transaksi</button></nav></div><div id="modal"></div>
          <script>
          const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
          function loadStore(k){let v=Android.getData(k);if(v===null||v===undefined){v=localStorage.getItem(k);if(v!==null)Android.saveData(k,v)}return v}
          let products=JSON.parse(loadStore('pds_products')||'null')||[{id:1,name:'Mie Jebew Asin',price:10000,kind:'yellow'},{id:2,name:'Mie Jebew Manis',price:10000,kind:'brown'}];
          let sales=JSON.parse(loadStore('pds_sales')||'[]'),cart={};
          function persist(){let p=JSON.stringify(products),s=JSON.stringify(sales);Android.saveData('pds_products',p);Android.saveData('pds_sales',s);localStorage.setItem('pds_products',p);localStorage.setItem('pds_sales',s)}
          function today(s){return new Date(s).toDateString()===new Date().toDateString()}
          function rupiah(n){return money(n)}
          function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('greet').textContent=({home:'Dashboard',cashier:'Kasir',products:'Produk',history:'Transaksi'}[page]||page);({home:home,cashier:cashier,products:productPage,history:history}[page]||home)()}
          function backToDashboard(){go('home')}
          function home(){let day=sales.filter(s=>today(s.date));let total=day.reduce((a,s)=>a+s.total,0);document.getElementById('view').innerHTML=`
          <div class="stats"><div class="stat"><div class="label">OMZET HARI INI</div><strong>${money(total)}</strong><em>● Data tersimpan di perangkat</em></div><div class="stat"><div class="label">TRANSAKSI HARI INI</div><strong>${day.length}</strong><em>● Offline-first aktif</em></div></div>
          <div class="panel"><div class="section-head"><h2>Menu utama</h2><span class="tag">PAK DE SURYA</span></div><div class="quick"><button onclick="go('cashier')"><i>▦</i>Kasir</button><button onclick="go('products')"><i>◈</i>Produk</button><button onclick="go('history')"><i>▤</i>Riwayat</button></div></div>
          <div class="panel"><div class="section-head"><h2>Aktivitas terbaru</h2><span class="muted">${day.length} hari ini</span></div>${day.length?day.slice(-3).reverse().map(s=>'<div class="historyline"><span>Pesanan • '+new Date(s.date).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+'</span><b>'+money(s.total)+'</b></div>').join(''):'<div class="empty">Belum ada transaksi hari ini</div>'}</div>
          <div class="panel"><div class="section-head"><h2>Status perangkat</h2><span class="pill">OFFLINE READY</span></div><div class="muted">Transaksi tersimpan lokal di perangkat. Sinkronisasi server akan diaktifkan pada tahap backend.</div></div>`}
          function productCard(p){return '<article class="product"><div class="food '+(p.kind==='brown'?'brown':'')+'">'+(p.kind==='brown'?'🍜':'🍝')+'</div><div class="product-info"><b>'+esc(p.name)+'</b><small>Menu Pak De Surya</small><div class="price-row"><span class="price">'+money(p.price)+'</span><button class="add" onclick="add('+p.id+')">+</button></div></div></article>'}
          function cashier(){document.getElementById('view').innerHTML='<div class="section-head"><div><div class="tag">ORDER BARU</div><h2>Menu favorit</h2></div><span class="pill">DINE IN / TAKE AWAY</span></div><input class="search" placeholder="Cari menu..." oninput="filterProducts(this.value)"><div class="product-grid" id="catalog">'+products.map(productCard).join('')+'</div><div class="panel"><div class="section-head"><h2>Keranjang</h2><span class="muted" id="cartcount"></span></div><div id="cartlines"></div><div class="total"><span>Total</span><span id="carttotal">'+money(0)+'</span></div><button class="primary" onclick="checkout()">LANJUT PEMBAYARAN →</button></div>';renderCart()}
          function filterProducts(q){document.getElementById('catalog').innerHTML=products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())).map(productCard).join('')||'<div class="empty">Menu tidak ditemukan</div>'}
          function add(id){cart[id]=(cart[id]||0)+1;renderCart()}
          function changeQty(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];renderCart()}
          function renderCart(){let el=document.getElementById('cartlines');if(!el)return;let entries=Object.entries(cart);el.innerHTML=entries.length?entries.map(([id,q])=>{let p=products.find(x=>x.id==id);return '<div class="cartline"><span><b>'+esc(p?.name||'Produk')+'</b><br><small class="muted">'+money(p?.price||0)+'</small></span><div class="qty"><button onclick="changeQty('+id+',-1)">−</button>'+q+'<button onclick="changeQty('+id+',1)">+</button></div><b>'+money((p?.price||0)*q)+'</b></div>'}).join(''):'<div class="empty">Keranjang masih kosong</div>';let total=entries.reduce((a,[id,q])=>a+(products.find(p=>p.id==id)?.price||0)*q,0);document.getElementById('carttotal').textContent=money(total);document.getElementById('cartcount').textContent=entries.reduce((a,[,q])=>a+q,0)+' item'}
          function checkout(){let items=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id==id);return {...p,qty:q}});if(!items.length){Android.toast('Keranjang masih kosong');return}let total=items.reduce((a,p)=>a+p.price*p.qty,0);openModal('<h3>Pembayaran</h3><div class="panel"><div class="muted">TOTAL TAGIHAN</div><div style="font-size:28px;font-weight:900;margin:6px 0 14px">'+money(total)+'</div>'+items.map(p=>'<div class="cartline">'+esc(p.name)+' × '+p.qty+'<b>'+money(p.price*p.qty)+'</b></div>').join('')+'</div><label class="muted">METODE PEMBAYARAN</label><select class="field" id="pay"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select><button class="primary" onclick="finishSale()">SIMPAN TRANSAKSI</button>')}
          function finishSale(){let items=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id==id);return {...p,qty:q}});let total=items.reduce((a,p)=>a+p.price*p.qty,0);let sale={id:Date.now(),date:new Date().toISOString(),items,total,payment:document.getElementById('pay').value,paymentStatus:'LUNAS',sync:'PENDING'};sales.push(sale);persist();cart={};closeModal();go('home');openModal('<div style="text-align:center"><div style="font-size:42px">✓</div><h3>Transaksi berhasil</h3><span class="pill">TERSIMPAN OFFLINE</span><p class="muted">Nomor transaksi #'+sale.id+'</p><h2>'+money(total)+'</h2><button class="primary" onclick="printSale('+sale.id+')">CETAK STRUK</button><button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">SELESAI</button></div>')}
          function printSale(id){let s=sales.find(x=>x.id==id);let receipt='PAK DE SURYA\nMIE AYAM\n------------------------------\n'+s.items.map(p=>p.name+' x'+p.qty+'  '+money(p.price*p.qty)).join('\n')+'\n------------------------------\nTOTAL '+money(s.total)+'\nBayar: '+s.payment+'\nTerima kasih!\n';Android.printReceipt(receipt)}
          function productPage(){document.getElementById('view').innerHTML='<div class="section-head"><div><div class="tag">KATALOG MENU</div><h2>Kelola produk</h2></div><button class="secondary" onclick="editProduct()">＋ Tambah</button></div><div class="muted" style="margin-bottom:14px">Atur nama dan harga menu Pak De Surya</div><div style="display:grid;gap:11px">'+(products.map(p=>'<div class="panel" style="margin:0;display:flex;gap:12px;align-items:center"><div class="food '+(p.kind==='brown'?'brown':'')+'" style="width:70px;height:70px;border-radius:13px;flex-shrink:0">'+(p.kind==='brown'?'🍜':'🍝')+'</div><div style="flex:1"><b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+'</div><div class="widebtn" style="margin-top:8px"><button class="secondary smallbtn" onclick="editProduct('+p.id+')">Edit</button><button class="danger smallbtn" onclick="deleteProduct('+p.id+')">Hapus</button></div></div></div>').join('')||'<div class="empty">Belum ada produk</div>')+'</div>'}
          function editProduct(id){let p=products.find(x=>x.id==id)||{name:'',price:10000,kind:'yellow'};openModal('<h3>'+(id?'Edit produk':'Produk baru')+'</h3><label class="muted">NAMA PRODUK</label><input class="field" id="pname" value="'+esc(p.name)+'" placeholder="Nama menu"><label class="muted">HARGA JUAL (RP)</label><input class="field" id="pprice" type="number" min="1" value="'+p.price+'"><label class="muted">TEMA FOTO</label><select class="field" id="pkind"><option value="yellow" '+(p.kind!=='brown'?'selected':'')+'>Mie kuning</option><option value="brown" '+(p.kind==='brown'?'selected':'')+'>Mie cokelat</option></select><button class="primary" onclick="saveProduct('+(id||0)+')">SIMPAN PRODUK</button>')}
          function saveProduct(id){let name=document.getElementById('pname').value.trim(),price=Number(document.getElementById('pprice').value),kind=document.getElementById('pkind').value;if(!name||!Number.isInteger(price)||price<1){Android.toast('Nama dan harga harus diisi dengan benar');return}if(id){let p=products.find(x=>x.id==id);Object.assign(p,{name,price,kind})}else products.push({id:Date.now(),name,price,kind});persist();closeModal();productPage()}
          function deleteProduct(id){openModal('<h3>Hapus produk?</h3><p class="muted">Produk akan dihapus dari katalog.</p><button class="primary danger" onclick="products=products.filter(p=>p.id!=='+id+');persist();closeModal();productPage()">YA, HAPUS</button>')}
          function history(){document.getElementById('view').innerHTML='<div class="section-head"><div><div class="tag">CATATAN PENJUALAN</div><h2>Riwayat transaksi</h2></div><span class="pill">'+sales.length+' TOTAL</span></div>'+sales.slice().reverse().map(s=>'<div class="panel" style="margin:0 0 10px"><div class="section-head"><b>'+money(s.total)+'</b><span class="pill">'+(s.paymentStatus||(s.payment?'LUNAS':'BELUM LUNAS'))+'</span></div><div class="muted">'+new Date(s.date).toLocaleString('id-ID')+' • '+s.payment+'</div><div class="muted" style="margin-top:8px">'+s.items.map(p=>esc(p.name)+' × '+p.qty).join(', ')+'</div><button class="secondary smallbtn" style="margin-top:10px" onclick="printSale('+s.id+')">Cetak ulang</button></div>').join('')||'<div class="empty">Belum ada transaksi</div>'}
          function openModal(html){document.getElementById('modal').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button>'+html+'</div></div>'}
          function closeModal(){document.getElementById('modal').innerHTML=''}
          function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
          go('home');
          </script></body></html>
