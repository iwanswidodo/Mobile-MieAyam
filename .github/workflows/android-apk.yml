          package id.pakdesurya.pos;
          import androidx.annotation.NonNull;
          import androidx.room.Entity;
          import androidx.room.PrimaryKey;
          @Entity(tableName="app_store") public class StoreEntry {
            @PrimaryKey @NonNull public String key;
            @NonNull public String value;
            public StoreEntry(@NonNull String key,@NonNull String value){this.key=key;this.value=value;}
          }
