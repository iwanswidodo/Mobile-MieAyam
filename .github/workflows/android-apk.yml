          cat > app/src/main/java/id/pakdesurya/pos/AppDatabase.java <<'JAVA'
          package id.pakdesurya.pos;
          import androidx.room.Database;
          import androidx.room.RoomDatabase;
          @Database(entities={StoreEntry.class},version=1,exportSchema=false)
